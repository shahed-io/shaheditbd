    <div id="root"></div>

    <!-- SW Blank Guard: unregister stale SW once, then let app load normally -->
    <script>
      (function() {
        // Only run guard on real browser (not iframe preview)
        var isInIframe = (window.self !== window.top);
        if (isInIframe) return;

        // Prevent infinite reload loop using sessionStorage flag
        var reloadKey = 'sw_reload_v2';
        var alreadyReloaded = sessionStorage.getItem(reloadKey);

        var guard = setTimeout(function() {
          var root = document.getElementById('root');
          if (!root || !root.firstChild) {
            if (alreadyReloaded) return; // Don't reload again
            sessionStorage.setItem(reloadKey, '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              }).finally(function() {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }, 6000);

        window.addEventListener('load', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.firstChild) {
              clearTimeout(guard);
              sessionStorage.removeItem(reloadKey); // Reset on successful load
            }
          }, 1000);
        });
      })();
    </script>
